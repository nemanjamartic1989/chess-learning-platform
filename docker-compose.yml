
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-learning-platform
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: chess-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess_learning
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
